version: 1
backend:
  phases:
    preBuild:
      commands:
        # Node 22: requerido por dependencias de las herramientas de Amplify. La imagen de build ya lo incluye;
        # sólo se instala si faltara.
        - nvm use 22 || nvm install 22
        - node -v && npm -v
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
